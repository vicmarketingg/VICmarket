<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172B45">
<title>Editorial Lívia Serpa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" id="brandSide" href="#/overview" style="text-decoration:none"></a>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-tools">
      <p class="side-label">Exportar</p>
      <button class="link-btn" data-action="export-md">Roteiros (.md)</button>
      <button class="link-btn" data-action="export-csv">Cronograma (.csv)</button>
      <button class="link-btn" data-action="export-json">Backup completo (.json)</button>
      <button class="link-btn" data-action="import-json">Importar backup</button>
      <button class="link-btn" data-action="upload" data-target="logo" id="logoAction">Adicionar logotipo</button>
      <p class="storage-note" id="storageNote"></p>
    </div>
  </aside>

  <header class="topbar">
    <a class="brand" id="brandTop" href="#/overview" style="text-decoration:none"></a>
  </header>

  <main class="main" id="view" tabindex="-1"></main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegação"></nav>
</div>

<div class="sheet-backdrop" id="sheet" hidden></div>
<div class="modal-backdrop" id="modal" hidden></div>
<div class="reader" id="reader" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileJson" accept="application/json,.json" hidden>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
