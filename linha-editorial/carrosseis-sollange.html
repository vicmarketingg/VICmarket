<style>
/* Layout: uma coluna de leitura; cada carrossel é uma fila de slides 4:5 que se desliza na horizontal, como no Instagram */
:root{
  --vinho:#3A0A15; --vinho-2:#5E1222; --fundo:#1E040B; --ouro:#E9C98A; --ouro-2:#C9A257;
  --creme:#FFF8F0; --texto:#F3E6D8; --suave:#C9AFA2; --linha:rgba(233,201,138,.35);
  --display:"Playfair Display",Georgia,"Times New Roman",serif; --corpo:Jost,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--fundo)}
body{color:var(--texto);font:400 16px/1.55 var(--corpo);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1100px;margin:0 auto}
header.topo{padding-block:56px 32px;border-bottom:1px solid var(--linha)}
.eyebrow{font:600 12px var(--corpo);letter-spacing:.24em;text-transform:uppercase;color:var(--ouro)}
h1{font:500 clamp(34px,6vw,58px)/1.05 var(--display);color:var(--creme);margin:14px 0 12px;text-wrap:balance}
h1 em{color:var(--ouro);font-style:italic}
.intro{max-width:62ch;color:var(--texto)}
nav.semanas{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
nav.semanas a{font:500 13px var(--corpo);letter-spacing:.06em;color:var(--ouro);text-decoration:none;border:1px solid var(--linha);border-radius:999px;padding:7px 14px}
nav.semanas a:hover,nav.semanas a:focus-visible{background:rgba(233,201,138,.12);outline:none}
section.semana{padding-top:48px;scroll-margin-top:16px}
h2{font:500 clamp(26px,4vw,36px)/1.15 var(--display);color:var(--creme);margin:6px 0 4px}
h2 + p{color:var(--suave);margin:0}
article.car{margin-top:32px}
.car-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.data{font:600 12px var(--corpo);letter-spacing:.18em;text-transform:uppercase;color:var(--vinho);background:var(--ouro);padding:5px 12px;border-radius:999px}
h3{font:500 22px/1.25 var(--display);color:var(--creme);margin:0;text-wrap:balance;min-width:0}
.tipo{font-size:13px;color:var(--suave)}
.fila{display:flex;gap:14px;overflow-x:auto;padding:16px 2px 14px;scroll-snap-type:x mandatory}
.fila::-webkit-scrollbar{height:8px}.fila::-webkit-scrollbar-thumb{background:var(--linha);border-radius:8px}
.slide{flex:0 0 260px;max-width:100%;aspect-ratio:4/5;scroll-snap-align:start;position:relative;border-radius:14px;padding:22px 20px 34px;display:flex;flex-direction:column;justify-content:center;gap:10px;
  background:radial-gradient(ellipse at 20% 0%,var(--vinho-2),var(--vinho) 55%,var(--fundo) 100%);border:1px solid var(--linha);overflow:hidden}
.slide.capa{background:linear-gradient(160deg,var(--vinho-2),var(--fundo));border-color:var(--ouro)}
.slide.cta{background:linear-gradient(145deg,#F3D9A0,var(--ouro-2) 60%,#A9813C);border:none}
.slide .n{position:absolute;top:12px;left:16px;font:600 11px var(--corpo);letter-spacing:.14em;color:var(--suave)}
.slide.cta .n{color:var(--vinho)}
.q{font:500 19px/1.25 var(--display);color:var(--creme);text-wrap:balance}
.capa .q{font-size:24px}
.q em{color:var(--ouro)}
.r{font:400 14.5px/1.5 var(--corpo);color:var(--texto)}
.r b{color:var(--ouro);font-weight:600}
.slide.cta .q,.slide.cta .r{color:var(--vinho)}
.slide.cta .r b{color:var(--vinho)}
.at{position:absolute;bottom:12px;left:0;right:0;text-align:center;font:500 10.5px var(--corpo);letter-spacing:.1em;color:var(--ouro)}
.slide.cta .at{color:var(--vinho)}
.dica{font-size:13px;color:var(--suave);margin-top:4px}
@media (max-width:480px){.slide{flex-basis:78vw}}
@media (prefers-reduced-motion:no-preference){.fila{scroll-behavior:smooth}}
</style>

    const art=document.createElement('article'); art.className='car';
    const total=c.slides.length;
    art.innerHTML=`<div class="car-head"><span class="data">${c.data}</span><h3>${c.titulo}</h3><span class="tipo">${c.tipo} · ${total} slides</span></div>`;
    const fila=document.createElement('div'); fila.className='fila'; fila.tabIndex=0; fila.setAttribute('aria-label','Slides de '+c.titulo.replace(/<[^>]+>/g,''));
    c.slides.forEach((s,i)=>{
      const d=document.createElement('div');
      d.className='slide'+(i===0?' capa':'')+(s[2]==='cta'?' cta':'');
      d.innerHTML=`<span class="n">${i+1}/${total}</span><p class="q">${s[0]}</p>${s[1]?`<p class="r">${s[1]}</p>`:''}<span class="at">@sollangealmadabinha</span>`;
      fila.appendChild(d);
    });
    art.appendChild(fila);
    const dica=document.createElement('p'); dica.className='dica'; dica.textContent='Desliza para o lado para ver todos os slides.'; art.appendChild(dica);
