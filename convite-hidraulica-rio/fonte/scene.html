<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/Anton.ttf)}
@font-face{font-family:Pop;src:url(fonts/Poppins-Medium.ttf);font-weight:500}
@font-face{font-family:Pop;src:url(fonts/Poppins-SemiBold.ttf);font-weight:600}
@font-face{font-family:Pop;src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:Pop;src:url(fonts/Poppins-ExtraBold.ttf);font-weight:800}
@font-face{font-family:Script;src:url(fonts/Yellowtail.ttf)}
html,body{margin:0;background:#fff}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<img id="logo" src="logo_t.png" style="display:none">
<script>
const W = 1080, H = 1920, CX = W/2, CY = H/2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const logo = document.getElementById('logo');

// ---------- utils ----------
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIn3 = x => x*x*x;
const eIO3 = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const eBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const lerp = (a, b, x) => a + (b - a) * x;
const gauss = (t, c, w) => Math.exp(-(((t - c)/w)**2));
function rngF(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// brand palette (Hidráulica Rio)
const NAVY = '#0b2466', NAVY2 = '#071a4d', ROYAL = '#1565e0', SKY = '#3d9bff';
function paint(c, kind, y0, y1){
  const g = c.createLinearGradient(0, y0, 0, y1);
  if (kind === 'blue'){ g.addColorStop(0, '#3a9dff'); g.addColorStop(.45, '#1a6ff0'); g.addColorStop(1, '#0a45b8'); }
  else if (kind === 'navy'){ g.addColorStop(0, '#163d96'); g.addColorStop(1, '#0a2160'); }
  else if (kind === 'light'){ g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#e6f2ff'); g.addColorStop(1, '#9fcaff'); }
  else return kind;
  return g;
}

// ---------- text ----------
function setFont(c, o){ c.font = `${o.wt||''} ${o.size}px ${o.fam||'Pop'}`.trim(); c.letterSpacing = (o.track||0) + 'px'; }
function wrap(text, o, maxW){
  setFont(ctx, o);
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words){ const tryL = cur ? cur + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && cur){ lines.push(cur); cur = w; } else cur = tryL; }
  if (cur) lines.push(cur); return lines;
}
function fitSize(text, o, maxW){
  setFont(ctx, o); const w = ctx.measureText(text).width; return w > maxW ? o.size * maxW / w : o.size;
}
function drawLine(c, text, x, y, o, a){
  setFont(c, o); c.textBaseline = 'middle'; c.textAlign = 'left';
  const words = text.split(' ');
  const space = c.measureText(' ').width + (o.track||0);
  const ws = words.map(w => c.measureText(w).width);
  const total = ws.reduce((s, v) => s + v, 0) + space * (words.length - 1);
  let px = o.align === 'left' ? x : x - total/2;
  const ex = a.exit != null ? eIn3(prog(a.t, a.exit, a.exit + (a.exitDur||.5))) : 0;
  words.forEach((w, i) => {
    const st = a.start + i * (a.stagger ?? .07);
    const p = eOut3(prog(a.t, st, st + (a.dur||.6)));
    const alpha = p * (1 - ex);
    if (alpha > 0.002){
      c.save(); c.globalAlpha *= alpha;
      const dy = (1 - p) * (o.rise ?? 36) - ex * 40;
      const bl = (1 - p) * 8 + ex * 10;
      if (bl > .4) c.filter = `blur(${bl.toFixed(1)}px)`;
      c.fillStyle = paint(c, o.color || NAVY, y - o.size*.55 + dy, y + o.size*.5 + dy);
      if (o.shadow){ c.shadowColor = o.shadow; c.shadowBlur = 14; c.shadowOffsetY = 5; }
      c.fillText(w, px, y + dy);
      c.restore();
    }
    px += ws[i] + space;
  });
  return total;
}
function drawPara(c, lines, x, y, lh, o, a){
  lines.forEach((ln, i) => drawLine(c, ln, x, y + i*lh, o, {...a, start: a.start + i*(a.lineDelay ?? .2)}));
}
function headline(text, x, y, o, a){
  const p = (a.ease||eOut5)(prog(a.t, a.start, a.start + (a.dur||.8)));
  const ex = a.exit != null ? eIn3(prog(a.t, a.exit, a.exit + (a.exitDur||.5))) : 0;
  const alpha = clamp(p*1.4) * (1 - ex);
  if (alpha <= 0.002) return;
  const sc = lerp(a.fromScale ?? 1.35, 1, p) * (1 + ex*.2);
  octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,W,H);
  setFont(octx, o); octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = paint(octx, o.color || NAVY, y - o.size*.5, y + o.size*.5);
  octx.fillText(text, x, y);
  if (a.shine != null){
    const sp = prog(a.t, a.shine, a.shine + 1.0);
    if (sp > 0 && sp < 1){
      const tw = octx.measureText(text).width;
      const sx = x - tw/2 - 200 + sp * (tw + 400);
      octx.globalCompositeOperation = 'source-atop';
      const g = octx.createLinearGradient(sx - 110, 0, sx + 110, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      octx.save(); octx.translate(sx, y); octx.transform(1,0,-.35,1,0,0); octx.translate(-sx, -y);
      octx.fillStyle = g; octx.fillRect(sx - 130, y - o.size, 260, o.size*2); octx.restore();
      octx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y + (1-p)*(a.rise||0) - ex*30);
  const bl = (1 - p) * (a.blur ?? 16) + ex * 12;
  ctx.shadowColor = o.shadow || 'rgba(8,36,110,.30)'; ctx.shadowBlur = o.shadowBlur ?? 22; ctx.shadowOffsetY = o.shadowY ?? 10;
  if (bl > .4) ctx.filter = `blur(${bl.toFixed(1)}px)`;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---------- background ----------
const R1 = rngF(11);
const bokeh = Array.from({length: 26}, () => ({
  x: R1()*W, y: R1()*H, r: 60 + R1()*190, blue: R1() < .65, ph: R1()*6.28, sp: .15 + R1()*.35,
  dx: (R1()-.5)*16, dy: -5 - R1()*14 }));
const dark = t => eIO3(prog(t, 13.85, 14.1)) * (1 - eIO3(prog(t, 19.55, 20.3)));

function background(t){
  const d = dark(t);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f7faff'); g.addColorStop(.5, '#e4eefc'); g.addColorStop(1, '#c9dcf6');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 4; i++){
    const ang = -0.5 + i * .33 + Math.sin(t*.2 + i) * .04;
    ctx.save(); ctx.translate(W*.85 - i*120, -100); ctx.rotate(ang);
    const bg = ctx.createLinearGradient(0, 0, 0, H*1.2);
    bg.addColorStop(0, 'rgba(255,255,255,.55)'); bg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.lineTo(200, H*1.2); ctx.lineTo(-200, H*1.2); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  if (d > 0){
    ctx.save(); ctx.globalAlpha = d;
    const dg = ctx.createRadialGradient(CX, H*.48, 60, CX, H*.5, H*.85);
    dg.addColorStop(0, '#1e6fe8'); dg.addColorStop(.45, '#0c3a9e'); dg.addColorStop(1, '#05164a');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  for (const b of bokeh){
    const x = (b.x + b.dx * t + W*2) % (W + 400) - 200;
    const y = ((b.y + b.dy * t) % (H + 400) + H + 400) % (H + 400) - 200;
    const a = (.06 + .07 * (0.5 + .5*Math.sin(t*b.sp*2 + b.ph)));
    const col = b.blue ? (d > .5 ? '120,190,255' : '40,120,240') : '255,255,255';
    const aa = b.blue ? a : a * 3.5;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    rg.addColorStop(0, `rgba(${col},${aa})`); rg.addColorStop(.7, `rgba(${col},${aa*.35})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 6.283); ctx.fill();
  }
}

// animated navy wave at the bottom (as in the brand art)
function bottomBand(t){
  const w1 = Math.sin(t*.8) * 18, w2 = Math.cos(t*.6) * 22;
  const yL = 1755 + w1, yR = 1690 + w2;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, yL);
  ctx.bezierCurveTo(W*.35, yL + 60, W*.65, yR - 70, W, yR);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, 1680, 0, H);
  g.addColorStop(0, '#0f3b9c'); g.addColorStop(1, NAVY2);
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(10,40,120,.35)'; ctx.shadowBlur = 30; ctx.fill();
  ctx.shadowBlur = 0;
  for (const [off, lw, col] of [[0, 7, 'rgba(61,155,255,1)'], [-26, 3, 'rgba(61,155,255,.55)']]){
    ctx.beginPath(); ctx.moveTo(0, yL + off);
    ctx.bezierCurveTo(W*.35, yL + 60 + off, W*.65, yR - 70 + off, W, yR + off);
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.shadowColor = 'rgba(80,170,255,.9)'; ctx.shadowBlur = 18; ctx.stroke();
  }
  ctx.restore();
}

// sparkles (3D depth)
const R2 = rngF(23);
const dust = Array.from({length: 200}, () => ({ x: (R2()-.5)*2.4, y: (R2()-.5)*4.2, z0: R2()*3, tw: R2()*6.28, s: .6 + R2()*1.4 }));
const TRANS = [6.1, 14.0, 20.0, 26.5];
function dustTravel(t){ let s = 0, n = 120, dt = t / n;
  for (let i = 0; i < n; i++){ const u = (i + .5) * dt; let v = .12; for (const c of TRANS) v += 1.6 * gauss(u, c, .35); s += v * dt; }
  return s; }
function particles(t, front){
  const travel = dustTravel(t), d = dark(t);
  const on = eOut3(prog(t, 0.2, 2.0));
  const speed = 1 + 1.6*TRANS.reduce((s,c)=>s+gauss(t,c,.35),0);
  ctx.save();
  for (const p of dust){
    const z = ((p.z0 - travel) % 3 + 3) % 3 + .15;
    if (front ? z > .7 : z <= .7) continue;
    const sx = CX + p.x / z * 420, sy = CY + p.y / z * 420;
    if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    const r = p.s * 2.4 / z;
    const tw = .55 + .45*Math.sin(t*3 + p.tw);
    const a = .8 * tw * clamp((3.15 - z) / .8) * clamp(z / .3) * on;
    const col = d > .5 ? '220,238,255' : '30,110,235';
    if (speed > 1.4){
      const k = (speed - 1) * .06;
      ctx.strokeStyle = `rgba(${col},${a*.5})`; ctx.lineWidth = r;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(CX + (sx-CX)*(1-k), CY + (sy-CY)*(1-k)); ctx.stroke();
    }
    const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r*3);
    rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(.3, `rgba(${col},${a*.55})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.fillRect(sx - r*3, sy - r*3, r*6, r*6);
  }
  ctx.restore();
}

function flare(t, c, y){
  const k = gauss(t, c, .28); if (k < .01) return;
  const x = lerp(-200, W + 200, prog(t, c - .6, c + .6));
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, 900);
  g.addColorStop(0, `rgba(255,255,255,${.95*k})`); g.addColorStop(.15, `rgba(120,190,255,${.4*k})`); g.addColorStop(1, 'rgba(120,190,255,0)');
  ctx.translate(x, y); ctx.scale(1, .05); ctx.translate(-x, -y);
  ctx.fillStyle = g; ctx.fillRect(x - 900, y - 900, 1800, 1800);
  ctx.restore();
  ctx.save();
  const g2 = ctx.createRadialGradient(x, y, 0, x, y, 240);
  g2.addColorStop(0, `rgba(255,255,255,${.7*k})`); g2.addColorStop(1, 'rgba(150,200,255,0)');
  ctx.fillStyle = g2; ctx.fillRect(x - 240, y - 240, 480, 480);
  ctx.restore();
}

// ---------- confetti ----------
const CCOL = ['#1565e0', '#3d9bff', '#0b2466', '#ffffff', '#9fcaff', '#c7d3e3'];
function makeConfetti(seed, n, t0, ox, oy, power){
  const r = rngF(seed);
  return Array.from({length: n}, () => { const ang = r() * 6.283, sp = (.3 + r()) * power;
    return { t0: t0 + r()*.08, x: ox + (r()-.5)*60, y: oy + (r()-.5)*60, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - power*.35,
      w: 14 + r()*18, h: 7 + r()*9, rot: r()*6.28, vr: (r()-.5)*10, flip: r()*6.28, vf: 4 + r()*8,
      col: CCOL[Math.floor(r()*6)], sway: r()*6.28, k: 1.6 + r()*1.2 }; });
}
function makeRain(seed, n, t0, span){
  const r = rngF(seed);
  return Array.from({length: n}, () => ({ rain: true, t0: t0 + r()*span, x: r()*W, y: -40 - r()*200,
    vx: (r()-.5)*40, vy: 130 + r()*130, w: 12 + r()*14, h: 6 + r()*8, rot: r()*6.28, vr: (r()-.5)*4,
    flip: r()*6.28, vf: 3 + r()*6, col: CCOL[Math.floor(r()*6)], sway: r()*6.28 }));
}
const CONF = [
  ...makeConfetti(101, 170, 14.0, CX, CY, 2400),
  ...makeConfetti(202, 110, 16.75, CX, 1000, 1700),
  ...makeRain(303, 60, 14.6, 5),
  ...makeRain(404, 110, 31.9, 3),
];
function confetti(t){
  for (const p of CONF){
    const dt = t - p.t0; if (dt < 0) continue;
    let x, y;
    if (p.rain){ x = p.x + p.vx*dt + Math.sin(dt*2 + p.sway)*30; y = p.y + p.vy*dt; }
    else { const e = (1 - Math.exp(-p.k*dt)) / p.k;
      x = p.x + p.vx*e + Math.sin(dt*2.2 + p.sway)*25*clamp(dt); y = p.y + p.vy*e + 260*(dt - e); }
    if (y > H + 60 || x < -60 || x > W + 60) continue;
    let a = p.rain ? 1 : clamp((5.5 - dt) / 1.5);
    if (t > 19.4 && p.t0 < 19){ if (t >= 20.3) continue; a *= clamp((20.0 - t)/.6); }
    if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.rotate(p.rot + p.vr*dt);
    const fl = Math.cos(p.flip + p.vf*dt); ctx.scale(1, fl);
    ctx.fillStyle = p.col; ctx.filter = `brightness(${(.6 + .4*Math.abs(fl)).toFixed(2)})`;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.restore();
  }
}

// ---------- brand elements ----------
function iconBadge(x, y, r, p, icon){
  if (p <= 0) return;
  const s = eBack(p);
  ctx.save(); ctx.globalAlpha *= clamp(p*2); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(8,40,120,.45)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 10;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283);
  const g = ctx.createRadialGradient(-r*.35, -r*.45, r*.1, 0, 0, r*1.1);
  g.addColorStop(0, '#4aa6ff'); g.addColorStop(.55, '#1557cf'); g.addColorStop(1, '#0a2a7a');
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(120,195,255,.9)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r - 12, 0, 6.283); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-r*.15, -r*.55, r*.55, r*.22, -.2, 0, 6.283);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = r*.075; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ICONS[icon](r*.42);
  ctx.restore();
}
const ICONS = {
  flag(s){ ctx.beginPath(); ctx.moveTo(-s*.7, s); ctx.lineTo(-s*.7, -s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*.7, -s); ctx.bezierCurveTo(-s*.2, -s*1.25, s*.2, -s*.7, s*.9, -s*.95);
    ctx.lineTo(s*.9, -s*.05); ctx.bezierCurveTo(s*.2, s*.2, -s*.2, -s*.35, -s*.7, -s*.1); ctx.stroke(); },
  trophy(s){ ctx.beginPath(); ctx.moveTo(-s*.65, -s); ctx.lineTo(s*.65, -s); ctx.lineTo(s*.55, -s*.2);
    ctx.quadraticCurveTo(s*.4, s*.3, 0, s*.35); ctx.quadraticCurveTo(-s*.4, s*.3, -s*.55, -s*.2); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*.62, -s*.75); ctx.quadraticCurveTo(-s*1.15, -s*.75, -s*1.0, -s*.3); ctx.quadraticCurveTo(-s*.85, 0, -s*.5, -s*.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*.62, -s*.75); ctx.quadraticCurveTo(s*1.15, -s*.75, s*1.0, -s*.3); ctx.quadraticCurveTo(s*.85, 0, s*.5, -s*.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, s*.35); ctx.lineTo(0, s*.75); ctx.moveTo(-s*.5, s*.95); ctx.lineTo(s*.5, s*.95); ctx.stroke(); },
  heart(s){ ctx.beginPath(); ctx.moveTo(0, s*.95);
    ctx.bezierCurveTo(-s*1.3, s*.05, -s*.95, -s*1.1, 0, -s*.45);
    ctx.bezierCurveTo(s*.95, -s*1.1, s*1.3, s*.05, 0, s*.95); ctx.stroke(); },
  gear(s){ const n = 8; ctx.beginPath();
    for (let i = 0; i < n*2; i++){ const a0 = i/(n*2)*6.283, a1 = (i+1)/(n*2)*6.283, R = i%2 ? s*.75 : s;
      ctx.arc(0, 0, R, a0, a1); }
    ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, s*.35, 0, 6.283); ctx.stroke(); },
  clock(s){ ctx.beginPath(); ctx.arc(0, 0, s, 0, 6.283); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, s*.65); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(.62)*s*.45, Math.sin(.62)*s*.45); ctx.stroke(); },
  pin(s){ ctx.beginPath(); ctx.moveTo(0, s*1.05);
    ctx.bezierCurveTo(-s*.35, s*.55, -s*.8, s*.05, -s*.8, -s*.3); ctx.arc(0, -s*.3, s*.8, Math.PI, 0);
    ctx.bezierCurveTo(s*.8, s*.05, s*.35, s*.55, 0, s*1.05); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s*.3, s*.28, 0, 6.283); ctx.stroke(); },
};

function cardRow(y, h, icon, lines, t, start, exit){
  const p = eOut3(prog(t, start, start + .7));
  const ex = exit != null ? eIn3(prog(t, exit, exit + .45)) : 0;
  if (p <= 0 || ex >= 1) return;
  const x0 = 210, x1 = 960, R = Math.min(92, h*.62);
  ctx.save(); ctx.globalAlpha *= (1 - ex);
  ctx.translate((1 - p) * 260 + ex * -200, 0);
  ctx.save(); ctx.globalAlpha *= p;
  ctx.shadowColor = 'rgba(10,45,120,.18)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  rr(ctx, x0, y - h/2, x1 - x0, h, 34);
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#eef4fd');
  ctx.fillStyle = g; ctx.fill();
  ctx.restore();
  iconBadge(x0 + 6, y, R, prog(t, start + .1, start + .7), icon);
  const tx = x0 + R + 50;
  const tot = lines.reduce((s, l) => s + l.lh, 0);
  let yy = y - tot/2;
  lines.forEach((l, i) => {
    yy += l.lh/2;
    const size = fitSize(l.text, l.o, x1 - tx - 30);
    drawLine(ctx, l.text, tx, yy, {...l.o, size, align: 'left', rise: 20}, {t, start: start + .2 + i*.12, stagger: .05});
    yy += l.lh/2;
  });
  ctx.restore();
}

function tag(cx, cy, w, h, ang, t, start, lines, exit){
  const p = eOut5(prog(t, start, start + .7));
  const ex = exit != null ? eIn3(prog(t, exit, exit + .45)) : 0;
  if (p <= 0 || ex >= 1) return;
  ctx.save(); ctx.globalAlpha *= (1 - ex);
  ctx.translate(cx, cy - ex*30); ctx.rotate(ang);
  ctx.save();
  ctx.beginPath(); ctx.rect(-w/2 - 40, -h/2 - 40, (w + 80) * p, h + 80); ctx.clip();
  ctx.shadowColor = 'rgba(8,40,120,.4)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 14;
  rr(ctx, -w/2, -h/2, w, h, 40);
  const g = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
  g.addColorStop(0, '#2d86ff'); g.addColorStop(.5, '#1257d6'); g.addColorStop(1, '#0a2f8a');
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(140,200,255,.7)'; ctx.stroke();
  rr(ctx, -w/2 + 10, -h/2 + 8, w - 20, h*.42, 32);
  const gl = ctx.createLinearGradient(0, -h/2, 0, 0);
  gl.addColorStop(0, 'rgba(255,255,255,.22)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fill();
  ctx.restore();
  lines.forEach((l, i) => drawLine(ctx, l.text, 0, l.y, {...l.o, color: '#fff', rise: 18}, {t, start: start + .3 + i*.25, stagger: .07}));
  ctx.restore();
}

function swoosh(x0, y0, x1, y1, bend, t, start, dur=.7, arrow=false, width=8, col=SKY){
  const p = eOut3(prog(t, start, start + dur)); if (p <= 0) return;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.lineWidth = width;
  ctx.shadowColor = 'rgba(30,110,240,.45)'; ctx.shadowBlur = 12;
  const n = 60, pts = [];
  for (let i = 0; i <= n * p; i++){ const u = i / n;
    const mx = (x0 + x1)/2, my = (y0 + y1)/2 + bend;
    pts.push([(1-u)*(1-u)*x0 + 2*(1-u)*u*mx + u*u*x1, (1-u)*(1-u)*y0 + 2*(1-u)*u*my + u*u*y1]); }
  ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
  ctx.stroke();
  if (arrow && p > .97 && pts.length > 2){
    const a = pts[pts.length-1], b = pts[pts.length-3]; const ang = Math.atan2(a[1]-b[1], a[0]-b[0]);
    ctx.beginPath(); ctx.moveTo(a[0] + Math.cos(ang + 2.5)*34, a[1] + Math.sin(ang + 2.5)*34); ctx.lineTo(a[0], a[1]);
    ctx.lineTo(a[0] + Math.cos(ang - 2.5)*34, a[1] + Math.sin(ang - 2.5)*34); ctx.stroke();
  }
  ctx.restore();
}

function logoAt(cx, cy, w, alpha, scale=1){
  if (alpha <= 0 || !logo.complete) return;
  const h = w * logo.naturalHeight / logo.naturalWidth;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.shadowColor = 'rgba(10,40,110,.18)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
  ctx.drawImage(logo, -w/2, -h/2, w, h); ctx.restore();
}
function header(t){
  const a = eOut3(prog(t, 0.25, 1.1)) * (1 - prog(t, 13.6, 13.95)) + eOut3(prog(t, 20.3, 21.0)) * (1 - prog(t, 31.2, 31.7));
  const y = 215 + Math.sin(t*1.2) * 4 + (1 - eOut3(prog(t, .25, 1.1))) * -30;
  logoAt(CX, y, 440, clamp(a));
}

function camera(scale, panY=0){ ctx.translate(CX, CY); ctx.scale(scale, scale); ctx.translate(-CX, -CY + panY); }

// ---------- scenes ----------
function scene1(t){
  if (t > 6.6) return;
  const out = eIn3(prog(t, 5.6, 6.35));
  ctx.save(); ctx.globalAlpha = 1 - out;
  camera(lerp(1, 1.05, eIO3(prog(t, 0, 5.6))) * (1 + out*1.8));
  headline('EI,', CX, 470, {fam:'Anton', size:150, track:6, color:'navy'}, {t, start:.7, dur:.8, fromScale:1.6, blur:18});
  headline('VOCÊ!', CX, 790, {fam:'Anton', size:fitSize('VOCÊ!', {fam:'Anton', size:420, track:8}, 820), track:8, color:'blue', shadowBlur:30, shadowY:14},
    {t, start:1.15, dur:.95, fromScale:1.9, blur:22, shine:2.0});
  swoosh(250, 1010, 830, 1000, 26, t, 1.9, .6, false, 10);
  drawPara(ctx, ['Sim, você que faz', 'parte do nosso time!'], CX, 1120, 88,
    {fam:'Pop', wt:800, size:66, color:'navy'}, {t, start:2.3, stagger:.06});
  tag(CX, 1430, 900, 270, -0.05, t, 3.5, [
    {text:'Tem um convite especial', y:-58, o:{fam:'Pop', wt:800, size:fitSize('Tem um convite especial', {fam:'Pop', wt:800, size:62}, 800)}},
    {text:'esperando por você...', y:52, o:{fam:'Script', size:118}},
  ]);
  swoosh(960, 1270, 1000, 1560, 120, t, 4.2, .6, true, 6, '#1a6ff0');
  ctx.restore();
}

function scene2(t){
  if (t < 5.7 || t > 14.3) return;
  const inp = eOut3(prog(t, 5.8, 6.8));
  const out = eIn3(prog(t, 13.45, 14.05));
  ctx.save(); ctx.globalAlpha = inp * (1 - out);
  camera(lerp(.85, 1, inp) * lerp(1, 1.04, prog(t, 6, 13.5)) * (1 - out*.35));
  const exA = 10.25;
  drawPara(ctx, ['Ao longo do ano,', 'compartilhamos'], CX, 480, 86, {fam:'Pop', wt:800, size:68, color:'navy'}, {t, start:6.3, exit:exA, exitDur:.45});
  const kw = [['flag','DESAFIOS,'], ['trophy','CONQUISTAS,'], ['heart','DEDICAÇÃO'], ['gear','E MUITO TRABALHO.']];
  kw.forEach(([ic, w], i) => cardRow(720 + i*200, 160, ic, [{text:w, lh:80, o:{fam:'Anton', size:86, track:2, color:i===3?'navy':'blue'}}], t, 7.0 + i*.55, exA + i*.06));
  drawPara(ctx, ['E cada pessoa que', 'faz parte dessa', 'história é'], CX, 640, 104, {fam:'Pop', wt:800, size:84, color:'navy'}, {t, start:10.75, stagger:.07, lineDelay:.25});
  headline('IMPORTANTE!', CX, 1030, {fam:'Anton', size:fitSize('IMPORTANTE!', {fam:'Anton', size:260, track:4}, 940), track:4, color:'blue', shadowBlur:30, shadowY:14},
    {t, start:11.6, dur:.9, fromScale:1.5, blur:18, shine:12.3});
  swoosh(230, 1200, 850, 1190, 30, t, 12.1, .6, false, 10);
  ctx.restore();
  const f = gauss(t, 14.0, .22);
  if (f > .01){ ctx.save();
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1200);
    g.addColorStop(0, `rgba(255,255,255,${f})`); g.addColorStop(.4, `rgba(160,210,255,${f*.8})`); g.addColorStop(1, `rgba(120,180,255,${f*.3})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

function rays(t, cx, cy, alpha){
  if (alpha <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(cx, cy); ctx.rotate(t * .08);
  for (let i = 0; i < 18; i++){ ctx.rotate(6.283 / 18);
    const g = ctx.createLinearGradient(0, 0, 0, -1200); const a = alpha * (.08 + .04*Math.sin(t*1.3 + i*1.7));
    g.addColorStop(0, `rgba(150,205,255,${a})`); g.addColorStop(1, 'rgba(150,205,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -1200); ctx.lineTo(60, -1200); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

function scene3(t){
  if (t < 13.9 || t > 20.5) return;
  const inp = eOut5(prog(t, 13.95, 14.6));
  const out = eIO3(prog(t, 19.55, 20.25));
  ctx.save(); ctx.translate(0, -out * 700); ctx.globalAlpha = inp * (1 - out);
  camera(lerp(1.12, 1, inp) * lerp(1, 1.04, prog(t, 14, 19.5)));
  rays(t, CX, 1000, eOut3(prog(t, 16.4, 17.4)) + gauss(t, 14.1, .5) * .8);
  const exA = 16.35;
  drawPara(ctx, ['Por isso, chegou a hora', 'de deixar um pouquinho', 'a rotina de lado'], CX, 680, 96,
    {fam:'Pop', wt:800, size:72, color:'#fff', shadow:'rgba(0,20,80,.5)'}, {t, start:14.25, stagger:.05, lineDelay:.22, exit:exA, exitDur:.4});
  headline('e celebrar juntos!', CX, 1060, {fam:'Script', size:fitSize('e celebrar juntos!', {fam:'Script', size:190}, 880), color:'light', shadow:'rgba(0,20,80,.55)'},
    {t, start:15.15, dur:.8, fromScale:1.25, blur:14, exit:exA, exitDur:.4, shine:15.6});
  drawPara(ctx, ['Você é nosso convidado', 'para a'], CX, 660, 92,
    {fam:'Pop', wt:800, size:72, color:'#fff', shadow:'rgba(0,20,80,.5)'}, {t, start:16.55, stagger:.05, lineDelay:.18});
  headline('CONFRATERNIZAÇÃO', CX, 930, {fam:'Anton', size:fitSize('CONFRATERNIZAÇÃO', {fam:'Anton', size:260, track:3}, 970), track:3, color:'light', shadow:'rgba(0,15,70,.6)', shadowBlur:34, shadowY:14},
    {t, start:16.75, dur:1.0, fromScale:1.7, blur:22, shine:17.6});
  const np = eOut5(prog(t, 17.6, 18.3));
  if (np > 0){
    ctx.save(); ctx.globalAlpha *= np; ctx.translate(CX, 1150); ctx.rotate(-0.035); ctx.scale(lerp(.8, 1, np), lerp(.8, 1, np));
    ctx.shadowColor = 'rgba(0,15,70,.5)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 14;
    rr(ctx, -420, -100, 840, 200, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    headline('HIDRÁULICA RIO!', CX, 1150, {fam:'Anton', size:fitSize('HIDRÁULICA RIO!', {fam:'Anton', size:150, track:4}, 760), track:4, color:'blue', shadowBlur:0, shadowY:0},
      {t, start:17.75, dur:.7, fromScale:.85, blur:10});
  }
  swoosh(180, 1310, 900, 1300, 30, t, 18.2, .6, true, 8, '#9fcaff');
  ctx.restore();
}

function scene4(t){
  if (t < 19.6 || t > 27.0) return;
  const inp = eIO3(prog(t, 19.6, 20.35));
  const out = eIn3(prog(t, 26.15, 26.8));
  ctx.save(); ctx.translate(0, (1 - inp) * 800); ctx.globalAlpha = inp * (1 - out);
  camera(lerp(1, 1.03, prog(t, 20.3, 26.2)) * (1 + out * .2));
  if (out > 0) ctx.filter = `blur(${(out*12).toFixed(1)}px)`;
  headline('NOSSO ENCONTRO JÁ TEM', CX, 420, {fam:'Anton', size:fitSize('NOSSO ENCONTRO JÁ TEM', {fam:'Anton', size:100, track:3}, 900), track:3, color:'navy', shadowBlur:10, shadowY:4},
    {t, start:20.25, dur:.6, fromScale:1.15, blur:10});
  headline('DATA MARCADA!', CX, 545, {fam:'Anton', size:fitSize('DATA MARCADA!', {fam:'Anton', size:170, track:4}, 930), track:4, color:'blue'},
    {t, start:20.5, dur:.7, fromScale:1.35, blur:14, shine:21.0});
  const cp = eOut5(prog(t, 20.85, 21.5));
  if (cp > 0){
    const y0 = 660 + (1 - cp) * 60, x0 = 150, w = 780, h = 520;
    ctx.save(); ctx.globalAlpha *= cp;
    ctx.translate(CX, y0 + h/2); ctx.rotate((1 - cp) * -.06); ctx.translate(-CX, -(y0 + h/2));
    ctx.shadowColor = 'rgba(10,45,120,.25)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
    rr(ctx, x0, y0, w, h, 40); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.save(); rr(ctx, x0, y0, w, h, 40); ctx.clip();
    const hg = ctx.createLinearGradient(0, y0, 0, y0 + 90); hg.addColorStop(0, '#2d86ff'); hg.addColorStop(1, '#0f4cc4');
    ctx.fillStyle = hg; ctx.fillRect(x0, y0, w, 90); ctx.restore();
    for (const rx of [x0 + 190, x0 + w - 190]){
      rr(ctx, rx - 14, y0 - 30, 28, 70, 14); ctx.fillStyle = '#0b2466'; ctx.fill();
      ctx.beginPath(); ctx.arc(rx, y0 + 45, 8, 0, 6.283); ctx.fillStyle = '#e8f0fc'; ctx.fill(); }
    ctx.restore();
  }
  headline('04', CX, 880, {fam:'Anton', size:320, color:'blue', shadowBlur:16, shadowY:8}, {t, start:21.2, dur:.85, fromScale:1.6, blur:18, shine:22.0});
  headline('DE DEZEMBRO', CX, 1060, {fam:'Anton', size:104, track:4, color:'navy', shadowBlur:0, shadowY:0}, {t, start:21.55, dur:.6, fromScale:1.2, blur:10});
  headline('DE 2026', CX, 1135, {fam:'Pop', wt:800, size:56, track:18, color:ROYAL, shadowBlur:0, shadowY:0}, {t, start:21.8, dur:.6, fromScale:1.2, blur:8});
  cardRow(1300, 150, 'clock', [{text:'ÀS 16H30', lh:90, o:{fam:'Anton', size:100, track:3, color:'navy'}}], t, 22.4);
  cardRow(1500, 210, 'pin', [
    {text:'Estrada do Vigário', lh:62, o:{fam:'Pop', wt:800, size:50, color:'navy'}},
    {text:'Geral, 773', lh:62, o:{fam:'Pop', wt:800, size:50, color:'navy'}},
    {text:'– Vigário Geral', lh:56, o:{fam:'Pop', wt:700, size:44, color:ROYAL}},
  ], t, 23.4);
  ctx.restore();
}

function scene5(t){
  if (t < 26.3) return;
  const inp = eOut3(prog(t, 26.4, 27.3));
  ctx.save(); ctx.globalAlpha = inp;
  camera(lerp(.9, 1, inp) * lerp(1, 1.04, prog(t, 26.5, 35)));
  const ex = 31.35;
  const o1 = {fam:'Pop', wt:800, size:66};
  const l1 = wrap('Mais do que uma confraternização, será um momento para celebrar as pessoas que fazem tudo acontecer.', o1, 930);
  drawPara(ctx, l1, CX, 470, 86, {...o1, color:'navy'}, {t, start:26.9, stagger:.04, lineDelay:.18, exit:ex, exitDur:.5});
  const ty = 470 + l1.length*86 + 190;
  tag(CX, ty, 920, 280, -0.05, t, 29.0, [
    {text:'Sua presença faz parte', y:-62, o:{fam:'Pop', wt:800, size:fitSize('Sua presença faz parte', {fam:'Pop', wt:800, size:64}, 820)}},
    {text:'dessa história!', y:55, o:{fam:'Script', size:126}},
  ], ex + .1);
  const fin = eOut3(prog(t, 31.9, 33));
  rays(t, CX, 1250, fin * .9);
  headline('ESPERAMOS', CX, 420, {fam:'Anton', size:fitSize('ESPERAMOS', {fam:'Anton', size:260, track:6}, 920), track:6, color:'navy'},
    {t, start:31.95, dur:.8, fromScale:1.6, blur:20});
  headline('POR VOCÊ!', CX, 680, {fam:'Anton', size:fitSize('POR VOCÊ!', {fam:'Anton', size:300, track:6}, 960), track:6, color:'blue', shadowBlur:30, shadowY:14},
    {t, start:32.15, dur:.85, fromScale:1.6, blur:20, shine:32.8});
  swoosh(220, 870, 860, 860, 28, t, 32.5, .6, false, 10);
  const lp = eOut5(prog(t, 32.6, 33.5));
  if (lp > 0){
    ctx.save(); ctx.globalAlpha *= lp;
    const g = ctx.createRadialGradient(CX, 1200, 40, CX, 1200, 520);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.6, 'rgba(255,255,255,.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(CX - 560, 680, 1120, 1040); ctx.restore();
    logoAt(CX, 1220, 860, lp, lerp(.75, 1, lp));
  }
  ctx.restore();
}

function vignette(){
  const g = ctx.createRadialGradient(CX, CY, H*.32, CX, CY, H*.75);
  g.addColorStop(0, 'rgba(10,40,110,0)'); g.addColorStop(1, 'rgba(10,40,110,.22)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = 'transparent';
  background(t);
  particles(t, false);
  header(t);
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none';
  bottomBand(t);
  confetti(t);
  particles(t, true);
  flare(t, 6.1, 960); flare(t, 20.0, 1000); flare(t, 26.5, 900); flare(t, 32.0, 760);
  vignette();
  const k = clamp(t / .6), e = eIO3(prog(t, 34.1, 35));
  if (k < 1){ ctx.fillStyle = `rgba(255,255,255,${1 - k})`; ctx.fillRect(0, 0, W, H); }
  if (e > 0){ ctx.fillStyle = `rgba(255,255,255,${e})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.ready = (async () => {
  await Promise.all(['100px Anton', '500 50px Pop', '700 50px Pop', '800 50px Pop', '50px Script'].map(f => document.fonts.load(f)));
  await new Promise(r => logo.complete ? r() : logo.onload = r);
  return true;
})();
window.grab = (t) => { render(t); return cv.toDataURL('image/jpeg', .93); };
</script></body></html>
