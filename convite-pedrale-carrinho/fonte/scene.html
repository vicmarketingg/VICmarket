<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;src:url(fonts/Montserrat.ttf);font-weight:100 900}
@font-face{font-family:Play;src:url(fonts/Playfair.ttf);font-weight:400 900}
@font-face{font-family:PlayI;src:url(fonts/PlayfairItalic.ttf);font-weight:400 900;font-style:italic}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<img id="logo" src="logo.png" style="display:none">
<script>
const W = 1080, H = 1920, CX = W/2, CY = H/2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');
const DUR = 35;

// ---------- utils ----------
const clamp = (x, a=0, b=1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut3 = x => 1 - Math.pow(1 - x, 3);
const eOut5 = x => 1 - Math.pow(1 - x, 5);
const eIn3 = x => x*x*x;
const eIO3 = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3)/2;
const eBack = x => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const lerp = (a, b, x) => a + (b - a) * x;
const gauss = (t, c, w) => Math.exp(-(((t - c)/w)**2));
function rngF(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

const GOLD = ['#fff6d8', '#f3d58f', '#d9b064', '#a97c34', '#e9cc84'];
function goldGrad(c, y0, y1){
  const g = c.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, GOLD[0]); g.addColorStop(.32, GOLD[1]); g.addColorStop(.58, GOLD[2]);
  g.addColorStop(.82, GOLD[3]); g.addColorStop(1, GOLD[4]);
  return g;
}

// ---------- text ----------
function font(fam, wt, size, italic){ return `${italic?'italic ':''}${wt} ${size}px ${fam}`; }
function setFont(c, o){ c.font = font(o.fam||'Mont', o.wt||700, o.size, o.italic); c.letterSpacing = (o.track||0) + 'px'; }
function wrap(text, o, maxW){
  setFont(ctx, o);
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words){ const tryL = cur ? cur + ' ' + w : w;
    if (ctx.measureText(tryL).width > maxW && cur){ lines.push(cur); cur = w; } else cur = tryL; }
  if (cur) lines.push(cur); return lines;
}
function fitSize(text, o, maxW){
  let s = o.size; setFont(ctx, {...o, size: s});
  const w = ctx.measureText(text).width; return w > maxW ? s * maxW / w : s;
}
// word-by-word reveal of one line, centered at (x,y) baseline-middle
// anim: {t, start, stagger, dur, exit, exitDur}
function drawLine(c, text, x, y, o, a){
  setFont(c, o);
  c.textBaseline = 'middle'; c.textAlign = 'left';
  const words = text.split(' ');
  const space = c.measureText(' ').width + (o.track||0);
  const ws = words.map(w => c.measureText(w).width);
  const total = ws.reduce((s, v) => s + v, 0) + space * (words.length - 1);
  let px = x - total/2;
  const ex = a.exit != null ? eIn3(prog(a.t, a.exit, a.exit + (a.exitDur||.5))) : 0;
  words.forEach((w, i) => {
    const st = a.start + i * (a.stagger ?? .07);
    const p = eOut3(prog(a.t, st, st + (a.dur||.7)));
    const alpha = p * (1 - ex);
    if (alpha > 0.002){
      c.save();
      c.globalAlpha *= alpha;
      const dy = (1 - p) * (o.rise ?? 34) - ex * 40;
      const bl = (1 - p) * 10 + ex * 12;
      if (bl > .4) c.filter = `blur(${bl.toFixed(1)}px)`;
      if (o.gold){ c.fillStyle = goldGrad(c, y - o.size*.55 + dy, y + o.size*.5 + dy); }
      else c.fillStyle = o.color || '#fff';
      if (o.glow){ c.shadowColor = o.glowColor || 'rgba(255,205,120,.55)'; c.shadowBlur = o.glow; }
      c.fillText(w, px, y + dy);
      c.restore();
    }
    px += ws[i] + space;
  });
  return total;
}
function drawPara(c, lines, x, y, lh, o, a){
  lines.forEach((ln, i) => drawLine(c, ln, x, y + i*lh, o, {...a, start: a.start + i*(a.lineDelay ?? .22)}));
}
// big headline with scale/blur entrance + shine sweep (rendered via offscreen)
function headline(text, x, y, o, a){
  const p = (a.ease||eOut5)(prog(a.t, a.start, a.start + (a.dur||.9)));
  const ex = a.exit != null ? eIn3(prog(a.t, a.exit, a.exit + (a.exitDur||.5))) : 0;
  const alpha = clamp(p*1.4) * (1 - ex);
  if (alpha <= 0.002) return;
  const sc = lerp(a.fromScale ?? 1.35, 1, p) * (1 + ex*.25);
  octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,W,H);
  setFont(octx, o); octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = o.gold ? goldGrad(octx, y - o.size*.5, y + o.size*.45) : (o.color||'#fff');
  octx.fillText(text, x, y);
  // shine
  if (a.shine != null){
    const sp = prog(a.t, a.shine, a.shine + 1.1);
    if (sp > 0 && sp < 1){
      const tw = octx.measureText(text).width;
      const sx = x - tw/2 - 200 + sp * (tw + 400);
      octx.globalCompositeOperation = 'source-atop';
      const g = octx.createLinearGradient(sx - 120, 0, sx + 120, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      octx.save(); octx.translate(sx, y); octx.transform(1,0,-.35,1,0,0); octx.translate(-sx, -y);
      octx.fillStyle = g; octx.fillRect(sx - 140, y - o.size, 280, o.size*2); octx.restore();
      octx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.scale(sc, sc); ctx.translate(-x, -y + (1-p)*(a.rise||0) - ex*30);
  const bl = (1 - p) * (a.blur ?? 18) + ex * 14;
  if (o.glow){ ctx.shadowColor = o.glowColor || 'rgba(255,200,110,.6)'; ctx.shadowBlur = o.glow; }
  if (bl > .4) ctx.filter = `blur(${bl.toFixed(1)}px)`;
  ctx.drawImage(off, 0, 0);
  ctx.restore();
}

// ---------- persistent world ----------
const R1 = rngF(11);
const bokeh = Array.from({length: 30}, () => ({
  x: R1()*W, y: R1()*H, r: 40 + R1()*170, gold: R1() < .6, ph: R1()*6.28, sp: .15 + R1()*.35,
  dx: (R1()-.5)*18, dy: -6 - R1()*16, depth: .3 + R1()*.7 }));
const R2 = rngF(23);
const dust = Array.from({length: 260}, () => ({
  x: (R2()-.5)*2.4, y: (R2()-.5)*4.2, z0: R2()*3, tw: R2()*6.28, s: .6 + R2()*1.4, warm: R2() }));
const TRANS = [6.1, 14.0, 20.0, 26.5];
function dustTravel(t){ // integral of speed
  let s = 0, n = 120, dt = t / n;
  for (let i = 0; i < n; i++){ const u = (i + .5) * dt;
    let v = .12; for (const c of TRANS) v += 1.6 * gauss(u, c, .35); s += v * dt; }
  return s;
}

function background(t){
  // base
  const warm = clamp(gauss(t, 17, 3.2) + prog(t, 31.5, 33)*.8, 0, 1);
  const g = ctx.createRadialGradient(CX, H*.42, 50, CX, H*.5, H*.85);
  g.addColorStop(0, `rgb(${lerp(20,34,warm)|0},${lerp(38,36,warm)|0},${lerp(78,60,warm)|0})`);
  g.addColorStop(.45, '#0a1631');
  g.addColorStop(1, '#03060f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const lightOn = eOut3(prog(t, 0.1, 2.2));
  // volumetric beams from top
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++){
    const ang = -0.35 + i*0.35 + Math.sin(t*.25 + i*2) * .06;
    ctx.save(); ctx.translate(CX + (i-1)*260, -120); ctx.rotate(ang);
    const bg = ctx.createLinearGradient(0, 0, 0, H*1.1);
    const a = (.06 + .02*Math.sin(t*.7+i)) * lightOn;
    bg.addColorStop(0, `rgba(255,222,160,${a})`); bg.addColorStop(1, 'rgba(255,222,160,0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(30, 0); ctx.lineTo(260, H*1.1); ctx.lineTo(-260, H*1.1); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // bokeh
  for (const b of bokeh){
    const x = (b.x + b.dx * t + W*2) % (W + 400) - 200;
    let y = ((b.y + b.dy * t) % (H + 400) + H + 400) % (H + 400) - 200;
    const a = (.05 + .07 * (0.5 + .5*Math.sin(t*b.sp*2 + b.ph))) * lightOn * b.depth;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    const col = b.gold ? '255,200,120' : '110,160,255';
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(.7, `rgba(${col},${a*.35})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

function particles(t, front){
  const travel = dustTravel(t);
  const on = eOut3(prog(t, 0.3, 2.5));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const d of dust){
    let z = ((d.z0 - travel) % 3 + 3) % 3 + .15;
    if (front ? z > .7 : z <= .7) continue;
    const sx = CX + d.x / z * 420, sy = CY + d.y / z * 420;
    if (sx < -50 || sx > W+50 || sy < -50 || sy > H+50) continue;
    const r = d.s * 2.6 / z;
    const tw = .55 + .45*Math.sin(t*3 + d.tw);
    const fadeZ = clamp((3.15 - z) / .8) * clamp(z / .3);
    const a = .75 * tw * fadeZ * on;
    const speed = 1 + 1.6*TRANS.reduce((s,c)=>s+gauss(t,c,.35),0);
    const col = d.warm < .8 ? '255,214,140' : '255,245,225';
    if (speed > 1.4){ // motion streak
      const k = (speed - 1) * .06;
      ctx.strokeStyle = `rgba(${col},${a*.6})`; ctx.lineWidth = r;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(CX + (sx-CX)*(1-k), CY + (sy-CY)*(1-k)); ctx.stroke();
    }
    const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r*3);
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(.25, `rgba(${col},${a*.5})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.fillRect(sx - r*3, sy - r*3, r*6, r*6);
  }
  ctx.restore();
}

// 3D gold ring (ellipse with depth-shaded stroke)
function ring3d(cx, cy, R, tiltX, rotZ, t, alpha, width=3){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rotZ);
  const n = 140;
  for (let i = 0; i < n; i++){
    const a0 = i / n * 6.283, a1 = (i + 1) / n * 6.283;
    const z = Math.sin(a0);
    const shade = .35 + .65 * (0.5 + .5 * z);
    ctx.strokeStyle = `rgba(${lerp(170,255,shade)|0},${lerp(120,226,shade)|0},${lerp(50,160,shade)|0},${alpha*shade})`;
    ctx.lineWidth = width * (0.7 + .5*(0.5+.5*z));
    ctx.beginPath();
    ctx.moveTo(Math.cos(a0)*R, Math.sin(a0)*R*Math.cos(tiltX));
    ctx.lineTo(Math.cos(a1)*R, Math.sin(a1)*R*Math.cos(tiltX));
    ctx.stroke();
  }
  ctx.restore();
}

function flare(t, c, y){
  const k = gauss(t, c, .28);
  if (k < .01) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const x = lerp(-200, W + 200, prog(t, c - .6, c + .6));
  const g = ctx.createRadialGradient(x, y, 0, x, y, 900);
  g.addColorStop(0, `rgba(255,236,190,${.9*k})`); g.addColorStop(.12, `rgba(255,205,120,${.35*k})`); g.addColorStop(1, 'rgba(255,190,100,0)');
  ctx.translate(x, y); ctx.scale(1, .045); ctx.translate(-x, -y);
  ctx.fillStyle = g; ctx.fillRect(x - 900, y - 900, 1800, 1800);
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g2 = ctx.createRadialGradient(x, y, 0, x, y, 260);
  g2.addColorStop(0, `rgba(255,240,210,${.55*k})`); g2.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g2; ctx.fillRect(x - 260, y - 260, 520, 520);
  ctx.restore();
}

// ---------- confetti ----------
function makeConfetti(seed, n, t0, ox, oy, power){
  const r = rngF(seed);
  return Array.from({length: n}, () => {
    const ang = r() * 6.283, sp = (.3 + r()) * power;
    return { t0: t0 + r()*.08, x: ox + (r()-.5)*60, y: oy + (r()-.5)*60,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - power*.35,
      w: 12 + r()*16, h: 6 + r()*8, rot: r()*6.28, vr: (r()-.5)*10, flip: r()*6.28, vf: 4 + r()*8,
      col: ['#f6dc9a','#e2bc6c','#fff3d6','#c99a4b','#ffffff','#b8892f'][Math.floor(r()*6)],
      sway: r()*6.28, k: 1.6 + r()*1.2 };
  });
}
function makeRain(seed, n, t0, span){
  const r = rngF(seed);
  return Array.from({length: n}, () => ({ rain: true, t0: t0 + r()*span, x: r()*W, y: -40 - r()*200,
    vx: (r()-.5)*40, vy: 120 + r()*120, w: 10 + r()*12, h: 5 + r()*7, rot: r()*6.28, vr: (r()-.5)*4,
    flip: r()*6.28, vf: 3 + r()*6, col: ['#f6dc9a','#e2bc6c','#fff3d6','#c99a4b','#ffffff'][Math.floor(r()*5)], sway: r()*6.28, k: 0 }));
}
const CONF = [
  ...makeConfetti(101, 170, 14.0, CX, CY, 2400),
  ...makeConfetti(202, 110, 16.75, CX, 1010, 1700),
  ...makeRain(303, 60, 14.6, 5),
  ...makeRain(404, 90, 31.9, 3),
];
function confetti(t){
  for (const p of CONF){
    const dt = t - p.t0; if (dt < 0) continue;
    let x, y;
    if (p.rain){ x = p.x + p.vx*dt + Math.sin(dt*2 + p.sway)*30; y = p.y + p.vy*dt; }
    else {
      const e = (1 - Math.exp(-p.k*dt)) / p.k;
      const g = 260; // terminal-ish fall
      x = p.x + p.vx*e + Math.sin(dt*2.2 + p.sway)*25*clamp(dt);
      y = p.y + p.vy*e + g*(dt - e);
    }
    if (y > H + 60 || x < -60 || x > W + 60) continue;
    let a = 1;
    if (!p.rain) a = clamp((5.5 - dt) / 1.5);
    if (t > 19.4 && t < 20.3 && p.t0 < 19) a *= clamp((20.0 - t)/.6);
    if (t >= 20.3 && p.t0 < 19) continue;
    if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a;
    ctx.translate(x, y); ctx.rotate(p.rot + p.vr*dt);
    const fl = Math.cos(p.flip + p.vf*dt);
    ctx.scale(1, fl);
    ctx.fillStyle = p.col;
    const shade = .55 + .45*Math.abs(fl);
    ctx.filter = `brightness(${shade.toFixed(2)})`;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  }
}

// ---------- icons ----------
function iconCalendar(x, y, s, a){
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = goldGrad(ctx, y - s, y + s); ctx.lineWidth = 5; ctx.lineCap = 'round';
  rr(x - s, y - s*.8, s*2, s*1.75, 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - s, y - s*.32); ctx.lineTo(x + s, y - s*.32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - s*.5, y - s*1.05); ctx.lineTo(x - s*.5, y - s*.6); ctx.moveTo(x + s*.5, y - s*1.05); ctx.lineTo(x + s*.5, y - s*.6); ctx.stroke();
  ctx.fillStyle = GOLD[1];
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++){ ctx.beginPath(); ctx.arc(x - s*.5 + i*s*.5, y + s*.1 + j*s*.42, 4.5, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function iconClock(x, y, s, a, t){
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = goldGrad(ctx, y - s, y + s); ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, s, 0, 6.283); ctx.stroke();
  const ang = -Math.PI/2 + a * 2.2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(ang)*s*.62, y + Math.sin(ang)*s*.62); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(-Math.PI/2 + 5.9 + a)*s*.42*0 + s*0, y + s*.0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - s*.0, y + s*.5); ctx.stroke(); // 6h30 -> minute hand down
  ctx.restore();
}
function iconPin(x, y, s, a){
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = goldGrad(ctx, y - s, y + s); ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y + s*1.05);
  ctx.bezierCurveTo(x - s*.35, y + s*.55, x - s*.85, y + s*.05, x - s*.85, y - s*.3);
  ctx.arc(x, y - s*.3, s*.85, Math.PI, 0);
  ctx.bezierCurveTo(x + s*.85, y + s*.05, x + s*.35, y + s*.55, x, y + s*1.05);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y - s*.3, s*.3, 0, 6.283); ctx.stroke();
  ctx.restore();
}
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function goldRule(x, y, half, p, a=1){
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const w = half * eOut3(p);
  const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
  g.addColorStop(0, 'rgba(217,176,100,0)'); g.addColorStop(.5, 'rgba(243,213,143,1)'); g.addColorStop(1, 'rgba(217,176,100,0)');
  ctx.fillStyle = g; ctx.fillRect(x - w, y - 1.5, w*2, 3);
  // diamond
  ctx.translate(x, y); ctx.rotate(Math.PI/4); ctx.fillStyle = GOLD[1];
  const d = 9 * eOut3(p); ctx.fillRect(-d/2, -d/2, d, d);
  ctx.restore();
}

// camera
function camera(scale, panY=0, rot=0){
  ctx.translate(CX, CY); ctx.scale(scale, scale); ctx.rotate(rot); ctx.translate(-CX, -CY + panY);
}

// ---------- scenes ----------
function scene1(t){
  if (t > 6.6) return;
  const out = eIn3(prog(t, 5.6, 6.35));
  ctx.save();
  ctx.globalAlpha = 1 - out;
  camera(lerp(1, 1.06, eIO3(prog(t, 0, 5.6))) * (1 + out*1.8));
  // discreet 3D rings behind
  const ra = eOut3(prog(t, 1.0, 2.5)) * .55;
  if (ra > 0){
    ring3d(CX, 820, 400, 1.22 + Math.sin(t*.4)*.05, -0.18 + t*.03, t, ra, 3);
    ring3d(CX, 820, 470, 1.32, 0.22 - t*.025, t, ra*.6, 2);
  }
  headline('EI,', CX, 640, {fam:'Mont', wt:800, size:120, track:14, color:'#fff'}, {t, start:.7, dur:.9, fromScale:1.6, blur:20});
  headline('VOCÊ!', CX, 830, {fam:'Mont', wt:900, size:fitSize('VOCÊ!', {fam:'Mont', wt:900, size:260, track:6}, 900), track:6, gold:true, glow:40},
    {t, start:1.15, dur:1.0, fromScale:1.9, blur:24, shine:2.0});
  goldRule(CX, 1000, 300, prog(t, 1.9, 2.8));
  drawPara(ctx, ['Sim, você que faz parte', 'do nosso time!'], CX, 1110, 74,
    {fam:'Mont', wt:600, size:56, color:'#fff'}, {t, start:2.3, stagger:.06});
  drawPara(ctx, ['Tem um convite especial', 'esperando por você...'], CX, 1330, 78,
    {fam:'PlayI', wt:500, size:62, italic:true, gold:true, glow:18}, {t, start:3.6, stagger:.08});
  ctx.restore();
}

// sphere network for scene 2
const R3 = rngF(77);
const nodes = Array.from({length: 46}, (_, i) => {
  const y = 1 - (i + .5) / 46 * 2, r = Math.sqrt(1 - y*y), th = i * 2.39996;
  return { x: Math.cos(th)*r, y, z: Math.sin(th)*r, ph: R3()*6.28 };
});
function network(t, cx, cy, R, alpha){
  const ry = t * .35, rx = .35;
  const P = nodes.map(n => {
    let x = n.x*Math.cos(ry) + n.z*Math.sin(ry), z = -n.x*Math.sin(ry) + n.z*Math.cos(ry);
    let y = n.y*Math.cos(rx) - z*Math.sin(rx); z = n.y*Math.sin(rx) + z*Math.cos(rx);
    const pz = 2.6 / (2.6 + z);
    return { sx: cx + x*R*pz, sy: cy + y*R*pz, z, pz, ph: n.ph };
  });
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++){
    const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y, dz = nodes[i].z - nodes[j].z;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (d < .5){
      const depth = (1 - (P[i].z + P[j].z)/4);
      ctx.strokeStyle = `rgba(240,200,130,${alpha * .32 * (1 - d/.5) * depth})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(P[i].sx, P[i].sy); ctx.lineTo(P[j].sx, P[j].sy); ctx.stroke();
    }
  }
  for (const p of P){
    const depth = .4 + .6*(1 - (p.z + 1)/2);
    const r = 5 * p.pz;
    const g = ctx.createRadialGradient(p.sx, p.sy, 0, p.sx, p.sy, r*4);
    const a = alpha * depth * (.7 + .3*Math.sin(t*3 + p.ph));
    g.addColorStop(0, `rgba(255,236,190,${a})`); g.addColorStop(.3, `rgba(255,200,120,${a*.5})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = g; ctx.fillRect(p.sx - r*4, p.sy - r*4, r*8, r*8);
  }
  ctx.restore();
}

function scene2(t){
  if (t < 5.7 || t > 14.3) return;
  const inp = eOut3(prog(t, 5.8, 6.8));
  const out = eIn3(prog(t, 13.45, 14.05));
  ctx.save();
  ctx.globalAlpha = inp * (1 - out);
  camera(lerp(.82, 1, inp) * lerp(1, 1.05, prog(t, 6, 13.5)) * (1 - out*.35), 110, 0);
  network(t, CX, 960, 470, .9 * eOut3(prog(t, 6.0, 7.5)) * (1 - eIn3(prog(t, 13.0, 13.8))*.0));
  // part A
  const exA = 10.25;
  drawLine(ctx, 'Ao longo do ano,', CX, 560, {fam:'Mont', wt:600, size:58, color:'#fff'}, {t, start:6.3, exit:exA, exitDur:.45});
  drawLine(ctx, 'compartilhamos', CX, 640, {fam:'Mont', wt:600, size:58, color:'#fff'}, {t, start:6.55, exit:exA, exitDur:.45});
  const kw = ['desafios,', 'conquistas,', 'dedicação', 'e muito trabalho.'];
  kw.forEach((w, i) => {
    const st = 7.05 + i * .55;
    const size = i === 3 ? 74 : 92;
    headline(w.toUpperCase(), CX, 790 + i * 125,
      {fam:'Mont', wt:i === 3 ? 700 : 900, size, track:i===3?6:4, gold:i!==3, color:'#fff', glow:i!==3?24:0},
      {t, start:st, dur:.7, fromScale:.7, blur:14, ease:eOut3, exit:exA + i*.05, exitDur:.45, shine: i!==3 ? st + .4 : null});
  });
  // part B
  const lines = ['E cada pessoa que', 'faz parte dessa', 'história é'];
  drawPara(ctx, lines, CX, 700, 92, {fam:'Mont', wt:700, size:72, color:'#fff'}, {t, start:10.75, stagger:.07, lineDelay:.25});
  headline('IMPORTANTE!', CX, 1010, {fam:'Mont', wt:900, size:fitSize('IMPORTANTE!', {fam:'Mont', wt:900, size:140, track:4}, 920), track:4, gold:true, glow:40},
    {t, start:11.6, dur:.9, fromScale:1.5, blur:18, shine:12.3});
  goldRule(CX, 1140, 260, prog(t, 12.0, 12.8));
  ctx.restore();
  // converge flash into scene 3
  const f = gauss(t, 14.0, .22);
  if (f > .01){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 1100);
    g.addColorStop(0, `rgba(255,240,210,${f})`); g.addColorStop(.35, `rgba(255,205,130,${f*.6})`); g.addColorStop(1, 'rgba(255,190,100,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

function rays(t, cx, cy, alpha){
  if (alpha <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(cx, cy); ctx.rotate(t * .08);
  for (let i = 0; i < 18; i++){
    ctx.rotate(6.283 / 18);
    const g = ctx.createLinearGradient(0, 0, 0, -1200);
    const a = alpha * (.07 + .04*Math.sin(t*1.3 + i*1.7));
    g.addColorStop(0, `rgba(255,215,140,${a})`); g.addColorStop(1, 'rgba(255,215,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -1200); ctx.lineTo(60, -1200); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function scene3(t){
  if (t < 13.9 || t > 20.5) return;
  const inp = eOut5(prog(t, 13.95, 14.6));
  const out = eIO3(prog(t, 19.55, 20.25));
  ctx.save();
  ctx.translate(0, -out * 700);
  ctx.globalAlpha = inp * (1 - out);
  camera(lerp(1.12, 1, inp) * lerp(1, 1.04, prog(t, 14, 19.5)));
  rays(t, CX, 1010, eOut3(prog(t, 16.4, 17.4)) * 1.0 + gauss(t, 14.1, .5) * .8);
  // part A
  const exA = 16.35;
  drawPara(ctx, ['Por isso, chegou a hora', 'de deixar um pouquinho', 'a rotina de lado'], CX, 760, 82,
    {fam:'Mont', wt:600, size:60, color:'#fff'}, {t, start:14.25, stagger:.05, lineDelay:.22, exit:exA, exitDur:.4});
  headline('e celebrar juntos!', CX, 1080, {fam:'PlayI', wt:600, size:96, italic:true, gold:true, glow:30},
    {t, start:15.15, dur:.8, fromScale:1.25, blur:14, exit:exA, exitDur:.4, shine:15.6});
  // part B
  drawPara(ctx, ['Você é nosso convidado', 'para a'], CX, 760, 76,
    {fam:'Mont', wt:600, size:58, color:'#fff'}, {t, start:16.55, stagger:.05, lineDelay:.18});
  const cs = fitSize('CONFRATERNIZAÇÃO', {fam:'Mont', wt:900, size:160, track:2}, 960);
  headline('CONFRATERNIZAÇÃO', CX, 1010, {fam:'Mont', wt:900, size:cs, track:2, gold:true, glow:46},
    {t, start:16.75, dur:1.0, fromScale:1.7, blur:22, shine:17.6});
  goldRule(CX, 1110, 380, prog(t, 17.4, 18.2));
  headline('PEDRALE CARRINHO!', CX, 1215, {fam:'Mont', wt:800, size:fitSize('PEDRALE CARRINHO!', {fam:'Mont', wt:800, size:70, track:8}, 880), track:8, color:'#fff', glow:16, glowColor:'rgba(255,220,160,.45)'},
    {t, start:17.75, dur:.8, fromScale:.85, blur:12, rise:30});
  ctx.restore();
}

function scene4(t){
  if (t < 19.6 || t > 27.0) return;
  const inp = eIO3(prog(t, 19.6, 20.35));
  const out = eIn3(prog(t, 26.15, 26.8));
  ctx.save();
  ctx.translate(0, (1 - inp) * 800);
  ctx.globalAlpha = inp * (1 - out);
  camera(lerp(1, 1.035, prog(t, 20.3, 26.2)) * (1 + out * .25));
  if (out > 0) ctx.filter = `blur(${(out*14).toFixed(1)}px)`;
  drawLine(ctx, 'NOSSO ENCONTRO JÁ TEM', CX, 400, {fam:'Mont', wt:700, size:54, track:5, color:'#fff'}, {t, start:20.3, stagger:.06});
  headline('DATA MARCADA!', CX, 490, {fam:'Mont', wt:900, size:fitSize('DATA MARCADA!', {fam:'Mont', wt:900, size:96, track:4}, 900), track:4, gold:true, glow:26},
    {t, start:20.6, dur:.7, fromScale:1.3, blur:14, shine:21.0});
  // glass card
  const cp = eOut3(prog(t, 20.75, 21.45));
  if (cp > 0){
    ctx.save(); ctx.globalAlpha *= cp;
    const y0 = 600 + (1 - cp) * 40;
    rr(110, y0, 860, 1010, 44);
    const fg = ctx.createLinearGradient(0, y0, 0, y0 + 1010);
    fg.addColorStop(0, 'rgba(255,255,255,0.09)'); fg.addColorStop(1, 'rgba(255,255,255,0.025)');
    ctx.fillStyle = fg; ctx.fill();
    const sg = ctx.createLinearGradient(110, y0, 970, y0 + 1010);
    sg.addColorStop(0, 'rgba(255,230,170,.9)'); sg.addColorStop(.5, 'rgba(200,160,90,.25)'); sg.addColorStop(1, 'rgba(255,230,170,.8)');
    ctx.strokeStyle = sg; ctx.lineWidth = 2.5; ctx.stroke();
    // sheen sweep over the card
    const sp = prog(t, 21.2, 22.6);
    if (sp > 0 && sp < 1){
      ctx.save(); rr(110, y0, 860, 1010, 44); ctx.clip();
      const sx = lerp(-300, 1400, sp);
      const g = ctx.createLinearGradient(sx - 200, 0, sx + 200, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,240,210,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
    ctx.restore();
  }
  // date
  const dA = eOut3(prog(t, 21.1, 21.8));
  iconCalendar(CX, 710 + (1-dA)*20, 36, dA);
  headline('04', CX, 900, {fam:'Play', wt:800, size:300, gold:true, glow:40}, {t, start:21.2, dur:.9, fromScale:1.5, blur:20, shine:22.0});
  drawLine(ctx, 'DE DEZEMBRO', CX, 1070, {fam:'Mont', wt:800, size:76, track:6, color:'#fff'}, {t, start:21.55, stagger:.1});
  drawLine(ctx, 'DE 2026', CX, 1150, {fam:'Mont', wt:600, size:50, track:22, gold:true}, {t, start:21.8, stagger:.1});
  goldRule(CX, 1225, 300, prog(t, 22.1, 22.8), .8);
  // time
  const tA = eOut3(prog(t, 22.4, 23.1));
  setFont(ctx, {fam:'Mont', wt:800, size:78, track:4});
  const tw = ctx.measureText('ÀS 16H30').width;
  iconClock(CX - tw/2 - 30 + (1-tA)*-30, 1305, 32, tA, t);
  ctx.save(); ctx.translate(36, 0);
  drawLine(ctx, 'ÀS 16H30', CX, 1308, {fam:'Mont', wt:800, size:78, track:4, color:'#fff'}, {t, start:22.45, stagger:.12});
  ctx.restore();
  goldRule(CX, 1385, 300, prog(t, 22.9, 23.6), .8);
  // address
  const aA = eOut3(prog(t, 23.4, 24.1));
  iconPin(CX, 1440 + (1-aA)*20, 26, aA);
  drawLine(ctx, 'Estrada do Vigário Geral, 773', CX, 1515, {fam:'Mont', wt:700, size:fitSize('Estrada do Vigário Geral, 773', {fam:'Mont', wt:700, size:48}, 780), color:'#fff'}, {t, start:23.5, stagger:.06});
  drawLine(ctx, '– Vigário Geral', CX, 1572, {fam:'Mont', wt:600, size:40, track:4, gold:true}, {t, start:23.9, stagger:.08});
  ctx.restore();
}

const logo = document.getElementById('logo');
function scene5(t){
  if (t < 26.3) return;
  const inp = eOut3(prog(t, 26.4, 27.3));
  ctx.save();
  ctx.globalAlpha = inp;
  camera(lerp(.9, 1, inp) * lerp(1, 1.05, prog(t, 26.5, 35)));
  // back: rings and rays at the finale
  const fin = eOut3(prog(t, 31.9, 33));
  rays(t, CX, 820, fin * 1.1);
  const ra = clamp(eOut3(prog(t, 26.8, 28.5)) * .45 + fin * .25);
  ring3d(CX, 850, 430, 1.25 + Math.sin(t*.4)*.05, -0.15 + t*.03, t, ra, 3);
  ring3d(CX, 850, 500, 1.34, 0.2 - t*.02, t, ra*.55, 2);
  // statements
  const ex = 31.35;
  const l1 = wrap('Mais do que uma confraternização, será um momento para celebrar as pessoas que fazem tudo acontecer.', {fam:'Mont', wt:600, size:54}, 880);
  drawPara(ctx, l1, CX, 680, 74, {fam:'Mont', wt:600, size:54, color:'#fff'}, {t, start:26.9, stagger:.045, lineDelay:.2, exit:ex, exitDur:.5});
  goldRule(CX, 680 + l1.length*74 + 10, 220, prog(t, 28.4, 29.2) * (1 - prog(t, ex, ex + .4)));
  drawPara(ctx, ['Sua presença faz parte', 'dessa história!'], CX, 680 + l1.length*74 + 120, 90,
    {fam:'PlayI', wt:600, size:74, italic:true, gold:true, glow:24}, {t, start:29.0, stagger:.08, lineDelay:.28, exit:ex + .1, exitDur:.5});
  // finale
  const es = fitSize('ESPERAMOS', {fam:'Mont', wt:900, size:170, track:6}, 900);
  headline('ESPERAMOS', CX, 660, {fam:'Mont', wt:900, size:es, track:6, color:'#fff', glow:20, glowColor:'rgba(255,225,170,.5)'},
    {t, start:31.95, dur:.8, fromScale:1.6, blur:20});
  headline('POR VOCÊ!', CX, 820, {fam:'Mont', wt:900, size:fitSize('POR VOCÊ!', {fam:'Mont', wt:900, size:170, track:6}, 900), track:6, gold:true, glow:44},
    {t, start:32.15, dur:.85, fromScale:1.6, blur:20, shine:32.8});
  goldRule(CX, 960, 360, prog(t, 32.5, 33.3));
  headline('PEDRALE CARRINHO', CX, 1065, {fam:'Play', wt:800, size:fitSize('PEDRALE CARRINHO', {fam:'Play', wt:800, size:110, track:4}, 920), track:4, gold:true, glow:30},
    {t, start:32.6, dur:.9, fromScale:.8, blur:14, rise:20, shine:33.5});
  // logo on a light card
  const lp = eOut3(prog(t, 33.0, 33.8));
  if (lp > 0 && logo.complete){
    const lw = 430, lh = lw * logo.naturalHeight / logo.naturalWidth;
    const pad = 34, cw = lw + pad*2, ch = lh + pad*2;
    const x = CX - cw/2, y = 1260 + (1 - lp) * 40;
    ctx.save(); ctx.globalAlpha *= lp;
    ctx.shadowColor = 'rgba(255,210,140,.35)'; ctx.shadowBlur = 40;
    rr(x, y, cw, ch, 28); ctx.fillStyle = '#fbfaf7'; ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = 'rgba(217,176,100,.9)'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.drawImage(logo, x + pad, y + pad, lw, lh);
    ctx.restore();
  }
  ctx.restore();
}

function vignette(){
  const g = ctx.createRadialGradient(CX, CY, H*.28, CX, CY, H*.72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  background(t);
  particles(t, false);
  scene1(t); scene2(t); scene3(t); scene4(t); scene5(t);
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.filter = 'none';
  confetti(t);
  particles(t, true);
  flare(t, 6.1, 960); flare(t, 20.0, 1000); flare(t, 26.5, 900); flare(t, 32.0, 820);
  vignette();
  // global fade in / out
  const k = clamp(t / .6) * (1 - eIO3(prog(t, 34.1, 35)));
  if (k < 1){ ctx.fillStyle = `rgba(0,0,0,${1 - k})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.ready = (async () => {
  await Promise.all([
    document.fonts.load('900 50px Mont'), document.fonts.load('600 50px Mont'), document.fonts.load('800 50px Play'),
    document.fonts.load('italic 600 50px PlayI'),
  ]);
  await new Promise(r => logo.complete ? r() : logo.onload = r);
  return true;
})();
window.grab = (t) => { render(t); return cv.toDataURL('image/jpeg', .93); };
</script></body></html>
