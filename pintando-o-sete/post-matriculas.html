<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lexend:wght@400;600;800&display=swap">
<style>
:root{--navy:#123a8f;--navy-d:#0d2a6b;--sky:#7cbcf5;--sky-l:#a9d4fb;--yellow:#ffd21f;--red:#e8433a;--green:#17a06b;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:Lexend,sans-serif}
.post{position:relative;width:1080px;height:1350px;background:var(--sky);overflow:hidden}
.swirl{position:absolute;inset:0}
h1{position:absolute;left:84px;top:64px;font-family:Anton,Impact,sans-serif;font-weight:400;line-height:.86;letter-spacing:-2px}
h1 .a{display:block;font-size:176px;color:var(--navy)}
h1 .b{display:block;font-size:176px;color:var(--yellow);-webkit-text-stroke:0;text-shadow:0 6px 0 rgba(13,42,107,.18)}
.year{position:absolute;left:660px;top:238px;font-family:Lexend;font-weight:800;font-size:124px;letter-spacing:-4px;line-height:1;
  -webkit-text-stroke:3px var(--white);paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(13,42,107,.25))}
.year span:nth-child(1){color:#1f5fd1}.year span:nth-child(2){color:var(--red)}.year span:nth-child(3){color:var(--yellow)}.year span:nth-child(4){color:var(--green)}
.badge{position:absolute;right:26px;top:420px;width:290px;height:290px;transform:rotate(-8deg)}
.photo{position:absolute;left:60px;top:470px;width:700px;height:640px}
.card{position:absolute;right:58px;top:748px;width:390px;background:var(--white);border-radius:44px;padding:40px 34px 40px 40px;
  display:flex;flex-direction:column;gap:28px;box-shadow:0 18px 40px rgba(13,42,107,.22)}
.item{display:flex;align-items:center;justify-content:space-between;gap:16px}
.item p{color:var(--navy);font-size:38px;line-height:1.05;text-align:right;font-weight:400}
.item p b{font-weight:800;display:block}
.check{flex:none;width:58px;height:58px}
.bar{position:absolute;left:62px;right:62px;bottom:62px;height:150px;background:var(--navy);border-radius:75px;
  display:flex;align-items:center;padding:0 44px 0 22px;gap:26px;color:var(--white)}
.logo{width:116px;height:116px;border-radius:50%;background:#fff;overflow:hidden;flex:none;border:4px solid var(--yellow)}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.name small{display:block;font-size:22px;letter-spacing:3px;font-weight:600;opacity:.9}
.name strong{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:52px;line-height:1;color:var(--yellow);letter-spacing:.5px}
.sep{width:3px;height:84px;background:rgba(255,255,255,.25);border-radius:2px;margin-left:auto}
.wa{display:flex;align-items:center;gap:16px}
.wa svg{width:64px;height:64px;flex:none}
.wa small{display:block;font-size:22px;opacity:.9}
.wa strong{display:block;font-size:34px;font-weight:800;letter-spacing:.5px}
</style></head><body>
<div class="post">
  <!-- fundo: ondas suaves -->
  <svg class="swirl" viewBox="0 0 1080 1350" aria-hidden="true">
    <path d="M-60 520 C 160 380, 360 640, 620 520 S 1020 300, 1160 420 L1160 -40 L-60 -40Z" fill="#8dc6f7"/>
    <path d="M-60 1180 C 200 1040, 420 1260, 700 1140 S 1000 980, 1160 1060 L1160 1400 L-60 1400Z" fill="#6cb0f0"/>
    <circle cx="1010" cy="250" r="150" fill="#93cbf8"/>
  </svg>

  <h1><span class="a">MATRÍCULAS</span><span class="b">ABERTAS</span></h1>
  <div class="year"><span>2</span><span>0</span><span>2</span><span>7</span></div>

  <!-- selo curvo -->
  <svg class="badge" viewBox="0 0 300 300">
    <defs><path id="arc" d="M 62 238 A 112 112 0 1 1 238 238"/></defs>
    <path d="M 62 238 A 112 112 0 1 1 238 238" fill="none" stroke="#1f6fe0" stroke-width="66" stroke-linecap="round"/>
    <text font-family="Lexend" font-weight="800" font-size="27" fill="#fff" letter-spacing="1.5" dy="9">
      <textPath href="#arc" startOffset="50%" text-anchor="middle">DO BERÇÁRIO AO PRÉ II</textPath>
    </text>
  </svg>

  <!-- foto em moldura orgânica amarela -->
  <svg class="photo" viewBox="0 0 700 640">
    <defs>
      <clipPath id="blob"><path d="M70 120 C 120 30, 330 10, 470 40 C 620 70, 690 170, 670 330 C 650 500, 600 610, 400 625 C 210 640, 60 600, 30 450 C 5 320, 20 210, 70 120Z"/></clipPath>
    </defs>
    <path d="M50 140 C 100 40, 330 0, 490 30 C 650 60, 715 180, 690 350 C 668 520, 610 640, 400 648 C 190 656, 30 610, 8 450 C -12 310, 0 230, 50 140Z" fill="#ffd21f"/>
    <image href="meninas.jpg" x="-20" y="10" width="760" height="630" preserveAspectRatio="xMidYMid slice" clip-path="url(#blob)"/>
    <!-- aviãozinho de papel com rastro -->
    <path d="M610 70 c -40 -30, -90 10, -60 40 s 40 -40, -20 -60" fill="none" stroke="#123a8f" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round" transform="translate(-520 -10)"/>
  </svg>

  <!-- estrelas -->
  <svg style="position:absolute;left:24px;top:930px;width:110px;height:110px" viewBox="0 0 100 100"><path d="M50 4 L61 39 L96 50 L61 61 L50 96 L39 61 L4 50 L39 39Z" fill="#ffd21f" stroke="#e7b400" stroke-width="2"/></svg>
  <svg style="position:absolute;left:960px;top:130px;width:80px;height:80px" viewBox="0 0 100 100"><path d="M50 4 L61 39 L96 50 L61 61 L50 96 L39 61 L4 50 L39 39Z" fill="#ffd21f" stroke="#e7b400" stroke-width="2"/></svg>
  <svg style="position:absolute;left:600px;top:420px;width:120px;height:90px" viewBox="0 0 120 90" aria-hidden="true">
    <path d="M6 44 L112 6 L78 84 L58 54 Z" fill="#fff" stroke="#123a8f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M58 54 L112 6" stroke="#123a8f" stroke-width="5"/>
  </svg>

  <div class="card">
    <div class="item"><p><b>Acolhimento</b>de verdade</p><svg class="check" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#ffd21f"/><path d="M17 31 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="item"><p>Valores e<b>aprendizado</b></p><svg class="check" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#ffd21f"/><path d="M17 31 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="item"><p><b>Agende a</b><b>sua visita</b></p><svg class="check" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#ffd21f"/><path d="M17 31 l9 9 l17 -19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  </div>

  <div class="bar">
    <div class="logo"><img src="logo.jpg" alt=""></div>
    <div class="name"><small>JARDIM ESCOLA</small><strong>PINTANDO O SETE</strong></div>
    <div class="sep"></div>
    <div class="wa">
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#ffd21f"/><path d="M32 14a17 17 0 0 0-14.6 25.7L15 49l9.6-2.5A17 17 0 1 0 32 14z" fill="#123a8f"/><path d="M25.5 23.5c.6-.4 1.6-.4 2 .4l1.6 3.6c.3.6 0 1.2-.4 1.7l-1 1.1c1.4 2.7 3.5 4.7 6.2 6l1.1-1.1c.4-.4 1.1-.6 1.7-.3l3.5 1.7c.7.4.8 1.3.4 2-.9 1.6-2.6 2.6-4.5 2.2-5.6-1.2-10.4-6-11.6-11.6-.3-1.6.4-3.4 1-4.4z" fill="#ffd21f"/></svg>
      <div><small>Matrículas pelo WhatsApp</small><strong>(21) 96621-6689</strong></div>
    </div>
  </div>
</div>
</body></html>
